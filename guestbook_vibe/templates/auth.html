{% extends "base.html" %}
{% block content %}
<div class="write">
  <h1>{{ 'Đăng ký' if registering else 'Đăng nhập' }}</h1>
  <p>Đăng nhập là tùy chọn. Bạn vẫn có thể dán giấy nhớ với tư cách khách.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Tên tài khoản</label>
    <input id="username" name="username" value="{{ username }}" maxlength="30" autocomplete="username" required>
    <label for="password">Mật khẩu</label>
    <input id="password" type="password" name="password" maxlength="128" {% if registering %}minlength="8"{% endif %} autocomplete="{{ 'new-password' if registering else 'current-password' }}" required>
    <button type="submit">{{ 'Đăng ký' if registering else 'Đăng nhập' }}</button>
  </form>
  <p><a href="{{ url_for('index') }}">Tiếp tục với tư cách khách</a></p>
</div>
{% endblock %}
